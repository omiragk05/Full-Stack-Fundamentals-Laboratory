<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LMS | Learning Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg bg-1 fg-2" data-bs-theme="dark">
        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold" href="index.html">LMS</a>



            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="offcanvas offcanvas-end" tabindex="-1" id="navbarMenu" aria-labelledby="navbarMenuLabel">

                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="navbarMenuLabel">
                        LMS Menu
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>

                <div class="offcanvas-body">
                    <div class="navbar-nav ms-auto">

                        <a class="nav-link" href="index.html">Home</a>
                        <a class="nav-link" href="courses.html">Courses</a>
                        <a class="nav-link" href="about.html">About</a>
                        <a class="nav-link" href="contact.html">Contact </a>
                        <button class="btn btn-outline-light ms-auto me-2" type="button" id="themeToggle"
                            aria-pressed="false">
                            Dark mode
                        </button>

                    </div>
                </div>

            </div>
        </div>
    </nav>

    <section class="container py-5">

        <h2 class="text-center fw-bold mb-4">
            Contact Us
        </h2>

        <form>

            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Your Name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Your Email" required>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="5" placeholder="Your Message" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Submit
            </button>

        </form>

    </section>


    <!-- Footer -->
    <footer class=" text-white text-center py-4 mt-auto">

        <p class="mb-2">
            &copy; 2026 LMS Platform. All Rights Reserved.
        </p>

        <a href="#privacy" class="text-white me-3">
            Privacy Policy
        </a>

        <a href="#terms" class="text-white">
            Terms of Service
        </a>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scipt.js"></script>
</body>

</html>
